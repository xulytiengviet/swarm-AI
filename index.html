<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#430012">
<meta name="description" content="Thiệp mời K28 – mô phỏng 33 tác tử cùng tái dựng thiệp trong 33 giây.">
<title>Thư Mời K28 · Tọa Độ Thanh Xuân</title>
<style>
:root{color-scheme:dark;--wine:#480014;--wine-dark:#280009;--gold:#efd28c;--gold-dim:#b88a55}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{min-height:100dvh;background:radial-gradient(ellipse at 50% 43%,#720c25 0%,#590016 45%,#36000e 80%,#28000a 100%);color:var(--gold);font-family:Georgia,"Times New Roman",serif}
main{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(12px,3.3vh,34px) 12px;gap:clamp(13px,3vh,35px)}
.poster{position:relative;width:min(92vw,calc((100dvh - 118px)*.667),790px);aspect-ratio:2/3;background:#fffcf3;overflow:hidden;box-shadow:0 22px 75px #120006b5,0 0 0 1px #e0bc70,0 0 0 4px #5e291b,0 0 0 5px #a98248;isolation:isolate}
.poster:before{position:absolute;inset:0;content:"";z-index:3;border:2px solid #caa65f;pointer-events:none}
#source{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover}
#reveal{display:block;position:absolute;inset:0;width:100%;height:100%;z-index:1}
#agents{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.agent{position:absolute;width:13px;height:18px;will-change:transform;opacity:0;transition:opacity .4s}
.agent svg{width:13px;height:18px;filter:drop-shadow(0 1px 1px #171019a0)}
.controls{width:min(92vw,calc((100dvh - 118px)*.667),790px);display:grid;grid-template-columns:auto minmax(75px,1fr) auto;gap:clamp(12px,5vw,62px);align-items:center}
.stat{display:inline-grid;place-items:center;border:1px solid #b99b5b;padding:6px 14px;border-radius:100px;color:#f6d99a;white-space:nowrap;font:italic clamp(12px,1.8vw,18px)/1.1 Georgia,"Times New Roman",serif;background:#42001345;min-height:29px}
.progress{display:block;position:relative;min-width:0;min-height:28px;width:100%;border:0;background:transparent;padding:0;cursor:pointer}
.progress:focus-visible{outline:2px solid #f6d99a;outline-offset:3px;border-radius:8px}
.track{display:block;height:3px;width:100%;background:#be6881a2;border-radius:10px;overflow:hidden}
.bar{display:block;height:100%;width:0;background:linear-gradient(90deg,#e9c67e,#ffe7a4);border-radius:10px;box-shadow:0 0 10px #f6d99a7a}
.assistive{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
@media(max-width:430px){main{gap:16px;padding:16px 8px}.controls{gap:13px}.stat{padding:5px 9px;font-size:12px}.poster{width:min(95vw,calc((100dvh - 88px)*.667))}.controls{width:min(95vw,calc((100dvh - 88px)*.667))}}
@media(prefers-reduced-motion:reduce){.agent{display:none}}
@media print{@page{size:A4 portrait;margin:0}body{background:#fff}main{display:block;min-height:0;padding:0}.controls,#agents{display:none!important}.poster{width:210mm;height:297mm;max-width:none;aspect-ratio:auto;border:0;box-shadow:none;margin:0}#reveal{width:100%;height:100%}}
</style>
</head>
<body>
<main>
  <section class="poster" id="poster" aria-label="Thư mời K28 – Tọa Độ Thanh Xuân">
    <img id="source" src="assets/k28-invitation.webp" alt="Thư mời K28 – Tọa Độ Thanh Xuân" width="900" height="1350" decoding="async">
    <canvas id="reveal" aria-label="Bản thư mời K28 đang được 33 tác tử phối hợp tái dựng"></canvas>
    <div id="agents" aria-hidden="true"></div>
  </section>
  <div class="controls" aria-label="Tiến trình dựng thiệp mời">
    <span class="stat">33 Agents</span>
    <button type="button" id="replay" class="progress" aria-label="Chạm để chạy lại mô phỏng 33 giây" title="Chạm để chạy lại">
      <span class="track"><span id="bar" class="bar"></span></span>
    </button>
    <span class="stat" id="time">33s</span>
  </div>
  <span class="assistive" id="announce" role="status" aria-live="polite">Đang dựng thư mời K28 trong 33 giây</span>
</main>
<script>
(()=>{
"use strict";
const DURATION=33,COUNT=33,PHRASE="cùng các bạn chuyên ngành Kinh tế, Khóa 28";
const source=document.getElementById("source"),poster=document.getElementById("poster"),
  canvas=document.getElementById("reveal"),ctx=canvas.getContext("2d"),
  agentsEl=document.getElementById("agents"),bar=document.getElementById("bar"),
  timeEl=document.getElementById("time"),announce=document.getElementById("announce");
const reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const surface=document.createElement("canvas"),surfaceCtx=surface.getContext("2d");
let started=0,elapsed=0,ready=false,finished=false,lastFrame=0,agents=[];
const columns=3,rows=11;
function buildCorrectedImage(){
 const w=source.naturalWidth,h=source.naturalHeight;
 if(!w||!h){ready=false;announce.textContent="Không tìm thấy ảnh thư mời K28.";return}
 surface.width=w;surface.height=h;canvas.width=w;canvas.height=h;
 surfaceCtx.drawImage(source,0,0,w,h);
 // Dòng được thay thế nằm ngay dưới "QUÝ THẦY CÔ KHOA ĐỊA LÝ".
 // Tọa độ chuẩn hóa theo ảnh gốc 1024 x 1536, giữ nguyên toàn bộ các vùng còn lại.
 const sx=w/1024,sy=h/1536;
 const x=345*sx,y=715*sy,bw=505*sx,bh=30*sy;
 const g=surfaceCtx.createLinearGradient(0,y,0,y+bh);
 g.addColorStop(0,"#fff7e5");g.addColorStop(.18,"#fcfdf7");g.addColorStop(1,"#fcfdf7");
 surfaceCtx.fillStyle=g;surfaceCtx.fillRect(x,y,bw,bh);
 surfaceCtx.fillStyle="#0a2f73";
 surfaceCtx.font="bold "+Math.round(27*sy)+"px Georgia, 'Times New Roman', serif";
 surfaceCtx.textAlign="center";surfaceCtx.textBaseline="alphabetic";
 surfaceCtx.fillText(PHRASE,600*sx,740*sy,568*sx);
 ready=true;draw(reduced?DURATION:elapsed);
}
const colors=["#f3d992","#f0bd73","#b9d2ff","#e9b8b5"];
for(let i=0;i<COUNT;i++){
 const el=document.createElement("span");el.className="agent";
 const c=colors[i%colors.length];
 el.innerHTML='<svg viewBox="0 0 23 29" aria-hidden="true"><path d="M2 2 L2 22 L8 17 L12.5 27 L17.5 24.7 L13 15 L22 15 Z" fill="'+c+'" stroke="#5b1930" stroke-width="1.4" stroke-linejoin="round"/></svg>';
 agentsEl.appendChild(el);
 agents.push({el,x:0,y:0,seed:i*1.618});
}
function draw(t){
 if(!ready)return;
 const w=canvas.width,h=canvas.height;
 ctx.fillStyle="#fffdf6";ctx.fillRect(0,0,w,h);
 for(let i=0;i<COUNT;i++){
   const c=i%columns,r=Math.floor(i/columns);
   const x=Math.floor(c*w/columns),y=Math.floor(r*h/rows);
   const rw=Math.ceil((c+1)*w/columns)-x,rh=Math.ceil((r+1)*h/rows)-y;
   const start=i*(DURATION-2.3)/(COUNT-1);
   const p=Math.max(0,Math.min(1,(t-start)/2.3));
   if(p<=0)continue;
   const revealW=Math.min(rw,Math.ceil(rw*p));
   ctx.drawImage(surface,x,y,revealW,rh,x,y,revealW,rh);
 }
 const box=poster.getBoundingClientRect();
 for(let i=0;i<COUNT;i++){
   const a=agents[i],col=i%columns,row=Math.floor(i/columns);
   const start=i*(DURATION-2.3)/(COUNT-1);
   const p=Math.max(0,Math.min(1,(t-start)/2.3));
   const active=t>=start-.25&&p<1;
   a.el.style.opacity=active?"0.9":"0";
   if(!active)continue;
   const x=((col+p)/columns)*box.width;
   const y=((row+.5)/rows)*box.height;
   a.el.style.transform="translate3d("+Math.round(x+Math.sin(t*5+a.seed)*4)+"px,"+Math.round(y+Math.cos(t*3+a.seed)*5)+"px,0)";
 }
 const percent=Math.round(100*Math.min(1,t/DURATION));
 bar.style.width=percent+"%";
 timeEl.textContent="33s";
 if(t>=DURATION&&!finished){finished=true;announce.textContent="Đã hoàn thành thư mời K28.";}
}
function tick(now){
 if(!ready){requestAnimationFrame(tick);return}
 if(!started)started=now-elapsed*1000;
 elapsed=Math.min(DURATION,(now-started)/1000);
 if(reduced)elapsed=DURATION;
 if(now-lastFrame>30||elapsed>=DURATION){draw(elapsed);lastFrame=now}
 if(elapsed<DURATION)requestAnimationFrame(tick);
}
function replay(){
 elapsed=0;started=0;finished=false;lastFrame=0;
 announce.textContent="33 Agent bắt đầu tái dựng thư mời K28";
 requestAnimationFrame(tick);
}
document.getElementById("replay").addEventListener("click",replay);
poster.addEventListener("click",()=>{if(elapsed>=DURATION)replay()});
source.addEventListener("load",()=>{buildCorrectedImage();replay()});
source.addEventListener("error",()=>{announce.textContent="Lỗi tải ảnh thư mời K28. Vui lòng tải lại trang.";});
if(source.complete&&source.naturalWidth){buildCorrectedImage();replay()}
})();
</script>
</body>
</html>
