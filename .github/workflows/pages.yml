# OPTIONAL manual-only deployment.
# IMPORTANT: GitHub-hosted runner was not allocated in run 42328432387
# (all attempts failed before any step). Prefer Settings > Pages >
# Source: Deploy from a branch > gh-pages / (root) instead.
# This workflow remains available for manual testing after runner provisioning is restored.
name: Deploy SwarmOps demo (manual)
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://xulytiengviet.github.io/swarm-AI/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage static site
        run: |
          set -eu
          test -s index.html
          test -s assets/k28-invitation.webp
          mkdir -p site/assets
          cp index.html site/index.html
          cp assets/k28-invitation.webp site/assets/k28-invitation.webp
          touch site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
